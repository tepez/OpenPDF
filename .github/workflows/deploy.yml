name: Deploy to S3 Maven Repository

on:
  push:
    branches: [tepez]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ fromJSON(vars.AWS_ACCOUNT_ROLES).tepez }}
          aws-region: eu-west-1

      - name: Build and deploy to S3 Maven repo
        run: mvn -B clean deploy -Dgpg.skip

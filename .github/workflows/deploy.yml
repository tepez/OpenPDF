name: Deploy to S3 Maven Repository

on:
  push:
    branches: [tepez]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: "runs-on=${{ github.run_id }}/runner=2cpu-linux-x64"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ fromJSON(vars.AWS_ACCOUNT_ROLES).tepez }}
          aws-region: eu-west-1

      - name: Build and install locally
        run: mvn -B clean install -Dgpg.skip

      - name: Deploy artifacts to S3 Maven repo
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          GROUP_PATH="com/github/librepdf"
          LOCAL_REPO="$HOME/.m2/repository/$GROUP_PATH"

          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            S3_BASE="s3://tepez-maven-repository/snapshot/$GROUP_PATH"
          else
            S3_BASE="s3://tepez-maven-repository/release/$GROUP_PATH"
          fi

          # Upload each module's artifacts
          for MODULE in openpdf-parent openpdf pdf-swing pdf-toolbox openpdf-fonts-extra; do
            echo "Deploying $MODULE $VERSION"
            aws s3 sync "$LOCAL_REPO/$MODULE/$VERSION/" "$S3_BASE/$MODULE/$VERSION/" --no-progress

            # Also sync maven-metadata.xml files if they exist
            if [ -f "$LOCAL_REPO/$MODULE/maven-metadata-local.xml" ]; then
              aws s3 cp "$LOCAL_REPO/$MODULE/maven-metadata-local.xml" "$S3_BASE/$MODULE/maven-metadata.xml" --no-progress
            fi
          done
